<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡群管理</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
  input { width: 100%; box-sizing: border-box; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #999; padding: 8px; text-align: center; }
  th { background: #eee; }
  button { margin: 5px 5px 5px 0; padding: 6px 12px; }
  .dragging { background: #ffd; }
</style>
</head>
<body>

<h2 contenteditable="true" id="title">打卡群管理</h2>

<button id="addBtn">新增成員</button>
<button id="incrementBtn">+1</button>
<button id="resetBtn">重置+1</button>
<button id="copyBtn">複製表格</button>

<table id="memberTable">
  <thead>
    <tr>
      <th>#</th>
      <th>名字</th>
      <th>天數</th>
      <th>備註</th>
      <th>捐獻</th>
      <th>活躍</th>
      <th>貢獻</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const table = document.getElementById('memberTable').getElementsByTagName('tbody')[0];
const addBtn = document.getElementById('addBtn');
const incrementBtn = document.getElementById('incrementBtn');
const resetBtn = document.getElementById('resetBtn');
const copyBtn = document.getElementById('copyBtn');

let members = JSON.parse(localStorage.getItem('members') || '[]');
let lastIncrement = localStorage.getItem('lastIncrement') || '';

// 判斷今天日期
function todayStr() {
  const now = new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
}

function saveMembers(){
  localStorage.setItem('members', JSON.stringify(members));
  localStorage.setItem('lastIncrement', lastIncrement);
}

function renderTable(){
  table.innerHTML = '';
  members.forEach((m, idx)=>{
    const row = table.insertRow();
    row.setAttribute('draggable', true);
    
    // 編號
    const cellNum = row.insertCell();
    const numInput = document.createElement('input');
    numInput.value = idx + 1;
    numInput.addEventListener('input',()=>{m.num=numInput.value; saveMembers();});
    cellNum.appendChild(numInput);

    // 名字
    const cellName = row.insertCell();
    const nameInput = document.createElement('input');
    nameInput.value = m.name;
    nameInput.addEventListener('input',()=>{m.name=nameInput.value; saveMembers();});
    cellName.appendChild(nameInput);

    // 天數
    const cellDays = row.insertCell();
    const daysInput = document.createElement('input');
    daysInput.type='number';
    daysInput.value=m.days;
    daysInput.addEventListener('input',()=>{m.days=parseInt(daysInput.value)||0; saveMembers();});
    cellDays.appendChild(daysInput);

    // 備註
    const cellNote = row.insertCell();
    const noteInput = document.createElement('input');
    noteInput.value=m.note;
    noteInput.addEventListener('input',()=>{m.note=noteInput.value; saveMembers();});
    cellNote.appendChild(noteInput);

    // 捐獻
    const cellDonate = row.insertCell();
    const donateInput = document.createElement('input');
    donateInput.type='number';
    donateInput.value=m.donate || 0;
    donateInput.addEventListener('input',()=>{
      m.donate=parseInt(donateInput.value)||0;
      m.contribute=(m.donate||0)+(m.active||0);
      contributeInput.value=m.contribute;
      saveMembers();
    });
    cellDonate.appendChild(donateInput);

    // 活躍
    const cellActive = row.insertCell();
    const activeInput = document.createElement('input');
    activeInput.type='number';
    activeInput.value=m.active || 0;
    activeInput.addEventListener('input',()=>{
      m.active=parseInt(activeInput.value)||0;
      m.contribute=(m.donate||0)+(m.active||0);
      contributeInput.value=m.contribute;
      saveMembers();
    });
    cellActive.appendChild(activeInput);

    // 貢獻
    const cellContribute = row.insertCell();
    const contributeInput = document.createElement('input');
    contributeInput.readOnly = true;
    contributeInput.value=m.contribute || 0;
    cellContribute.appendChild(contributeInput);

    // 刪除
    const cellDelete = row.insertCell();
    const delBtn = document.createElement('button');
    delBtn.textContent='刪除';
    delBtn.addEventListener('click',()=>{
      members.splice(idx,1);
      saveMembers();
      renderTable();
    });
    cellDelete.appendChild(delBtn);

    // 拖曳事件
    row.addEventListener('dragstart',(e)=>{row.classList.add('dragging'); e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',(e)=>{row.classList.remove('dragging'); members=[]; Array.from(table.rows).forEach(r=>{
      const idx=parseInt(r.cells[0].getElementsByTagName('input')[0].value)||0;
      const name=r.cells[1].getElementsByTagName('input')[0].value;
      const days=parseInt(r.cells[2].getElementsByTagName('input')[0].value)||0;
      const note=r.cells[3].getElementsByTagName('input')[0].value;
      const donate=parseInt(r.cells[4].getElementsByTagName('input')[0].value)||0;
      const active=parseInt(r.cells[5].getElementsByTagName('input')[0].value)||0;
      const contribute=parseInt(r.cells[6].getElementsByTagName('input')[0].value)||0;
      members.push({num:idx,name,days,note,donate,active,contribute});
    }); saveMembers(); renderTable();});
    row.addEventListener('dragover',(e)=>{e.preventDefault(); const draggingRow=document.querySelector('.dragging'); if(draggingRow && row!==draggingRow){
      table.insertBefore(draggingRow,row.nextSibling);
    }});
  });

  // +1 按鈕灰色狀態
  if(lastIncrement===todayStr()) incrementBtn.disabled=true;
  else incrementBtn.disabled=false;
}

// 新增成員
addBtn.addEventListener('click',()=>{
  const newMember = {num:members.length+1,name:'',days:0,note:'',donate:0,active:0,contribute:0};
  members.push(newMember);
  saveMembers();
  renderTable();
});

// +1 按鈕
incrementBtn.addEventListener('click',()=>{
  const today = todayStr();
  if(lastIncrement===today) return;
  members.forEach(m=>{ m.days=(m.days||0)+1; });
  lastIncrement=today;
  incrementBtn.disabled=true;
  saveMembers();
  renderTable();
});

// 重置+1
resetBtn.addEventListener('click',()=>{
  const today = todayStr();
  if(lastIncrement!==today) return; // 沒有今天+1的動作
  members.forEach(m=>{
    if(m.days>0) m.days-=1;
  });
  lastIncrement='';
  incrementBtn.disabled=false;
  saveMembers();
  renderTable();
});

// 複製表格
copyBtn.addEventListener('click',()=>{
  let text='編號\t名字\t天數\t備註\t捐獻\t活躍\t貢獻\n';
  members.forEach(m=>{
    text+=`${m.num}\t${m.name}\t${m.days}\t${m.note}\t${m.donate}\t${m.active}\t${m.contribute}\n`;
  });
  navigator.clipboard.writeText(text);
  alert('已複製到剪貼簿');
});

// 初始化
renderTable();
</script>
</body>
</html>
