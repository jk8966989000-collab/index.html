<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡群管理</title>
<style>
body { font-family: Arial, sans-serif; margin:20px; background:#f5f5f5; }
h1 input { font-size: 24px; width: 400px; }
table { border-collapse: collapse; width: 100%; background:#fff; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #eee; }
button { padding: 5px 10px; margin:2px; }
button:disabled { opacity:0.5; }
.dragging { opacity:0.5; }
input[type="text"], input[type="number"] { width: 90%; }
</style>
</head>
<body>

<h1><input id="titleInput" value="打卡群管理"></h1>

<button id="addMemberBtn">新增成員</button>
<button id="incrementBtn">+1</button>
<button id="resetBtn">重置+1</button>

<table id="memberTable">
  <thead>
    <tr>
      <th>#</th>
      <th>名字</th>
      <th>天數</th>
      <th>備註</th>
      <th>捐獻</th>
      <th>活躍</th>
      <th>貢獻</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
  </tbody>
</table>

<button id="copyBtn">複製表格</button>

<script>
let members = [];
let lastIncrementDate = null;
const tableBody = document.querySelector("#memberTable tbody");
const incrementBtn = document.getElementById("incrementBtn");
const resetBtn = document.getElementById("resetBtn");
const copyBtn = document.getElementById("copyBtn");
const titleInput = document.getElementById("titleInput");

// ---------- LocalStorage ----------

// 讀取資料
function loadData(){
  const savedData = localStorage.getItem("checkinData");
  if(savedData){
    const obj = JSON.parse(savedData);
    members = obj.members || [];
    lastIncrementDate = obj.lastIncrementDate || null;
    titleInput.value = obj.title || "打卡群管理";
  }
}

// 儲存資料
function saveData(){
  const obj = {
    members,
    lastIncrementDate,
    title: titleInput.value
  };
  localStorage.setItem("checkinData",JSON.stringify(obj));
}

// ---------- 主要功能 ----------

function checkIncrementStatus() {
  const today = new Date().toDateString();
  if(lastIncrementDate === today){
    incrementBtn.disabled = true;
  } else {
    incrementBtn.disabled = false;
  }
}
checkIncrementStatus();

// 建立新成員
function addMember(name="") {
  const member = {
    id: members.length +1,
    name: name,
    days:1, // 新增成員天數預設1
    note:"",
    donation:0,
    activity:0,
    contribution:0,
    incrementedToday:false
  };
  members.push(member);
  renderTable();
  saveData();
}

// 更新表格
function renderTable() {
  tableBody.innerHTML = "";
  members.forEach((m,index)=>{
    const tr = document.createElement("tr");
    tr.draggable = true;

    tr.innerHTML = `
      <td><input type="number" value="${index+1}" style="width:50px"></td>
      <td><input type="text" value="${m.name}"></td>
      <td><input type="number" value="${m.days}"></td>
      <td><input type="text" value="${m.note}"></td>
      <td><input type="number" value="${m.donation}"></td>
      <td><input type="number" value="${m.activity}"></td>
      <td><input type="number" value="${m.contribution}" readonly></td>
      <td><button class="deleteBtn">刪除</button></td>
    `;
    tableBody.appendChild(tr);

    // 事件：名字
    tr.children[1].querySelector("input").addEventListener("input",(e)=>{
      m.name=e.target.value; saveData();
    });
    // 天數
    tr.children[2].querySelector("input").addEventListener("input",(e)=>{
      m.days=parseInt(e.target.value)||0; saveData();
    });
    // 備註
    tr.children[3].querySelector("input").addEventListener("input",(e)=>{
      m.note=e.target.value; saveData();
    });
    // 捐獻
    tr.children[4].querySelector("input").addEventListener("input",(e)=>{
      m.donation=parseInt(e.target.value)||0;
      m.contribution = m.donation + m.activity;
      tr.children[6].querySelector("input").value = m.contribution;
      saveData();
    });
    // 活躍
    tr.children[5].querySelector("input").addEventListener("input",(e)=>{
      m.activity=parseInt(e.target.value)||0;
      m.contribution = m.donation + m.activity;
      tr.children[6].querySelector("input").value = m.contribution;
      saveData();
    });
    // 刪除
    tr.querySelector(".deleteBtn").addEventListener("click",()=>{
      members.splice(index,1);
      renderTable();
      saveData();
    });

    // 拖曳排序
    tr.addEventListener("dragstart",(e)=>{
      tr.classList.add("dragging");
      e.dataTransfer.setData("text/plain",index);
    });
    tr.addEventListener("dragend",(e)=>{
      tr.classList.remove("dragging");
      renderTable();
      saveData();
    });
    tr.addEventListener("dragover",(e)=>{
      e.preventDefault();
      const dragging = document.querySelector(".dragging");
      const currentIndex = index;
      const draggingIndex = parseInt(e.dataTransfer.getData("text/plain"));
      if(draggingIndex !== currentIndex){
        members.splice(currentIndex,0,members.splice(draggingIndex,1)[0]);
        e.dataTransfer.setData("text/plain",currentIndex);
        renderTable();
        saveData();
      }
    });
  });
}

// +1按鈕
incrementBtn.addEventListener("click",()=>{
  const today = new Date().toDateString();
  members.forEach(m=>{
    m.days +=1;
    m.incrementedToday=true;
  });
  lastIncrementDate = today;
  incrementBtn.disabled = true;
  renderTable();
  saveData();
});

// 重置+1
resetBtn.addEventListener("click",()=>{
  members.forEach(m=>{
    if(m.incrementedToday){
      m.days -=1;
      m.incrementedToday=false;
    }
  });
  lastIncrementDate = null;
  incrementBtn.disabled = false;
  renderTable();
  saveData();
});

// 新增成員
document.getElementById("addMemberBtn").addEventListener("click",()=>{
  const name = prompt("輸入新成員名字","");
  if(name) addMember(name);
});

// 複製表格
copyBtn.addEventListener("click",()=>{
  let text = "編號\t名字\t天數\t備註\t捐獻\t活躍\t貢獻\n";
  members.forEach((m,i)=>{
    text += `${i+1}\t${m.name}\t${m.days}\t${m.note}\t${m.donation}\t${m.activity}\t${m.contribution}\n`;
  });
  navigator.clipboard.writeText(text).then(()=>alert("已複製到剪貼簿"));
});

// title修改即時儲存
titleInput.addEventListener("input",()=>{ saveData(); });

// 定時每日檢查00:00刷新
setInterval(()=>{
  checkIncrementStatus();
},60000);

// 初始化
loadData();
renderTable();
checkIncrementStatus();

</script>
</body>
</html>
