<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡管理工具</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #f4f6f9;
}

h2 {
  margin-bottom: 10px;
}

button {
  padding: 6px 12px;
  margin: 5px 0;
  cursor: pointer;
}

button:disabled {
  background: #ccc;
  cursor: not-allowed;
}

table {
  border-collapse: collapse;
  width: 100%;
  background: white;
}

th, td {
  border: 1px solid #ccc;
  padding: 6px;
  text-align: center;
}

td input {
  width: 95%;
  border: none;
  text-align: center;
}

td input:focus {
  outline: 1px solid #4a90e2;
}

.dragging {
  opacity: 0.5;
}
</style>
</head>

<body>

<h2>打卡群管理</h2>

<input type="text" id="newName" placeholder="輸入新成員名字">
<button onclick="addMember()">新增成員</button>
<button id="addOneBtn" onclick="addOneDay()">全員 +1</button>
<button onclick="copyAll()">複製全部資料</button>

<br><br>

<table id="table">
  <thead>
    <tr>
      <th>編號</th>
      <th>名字</th>
      <th>天數</th>
      <th>備註</th>
      <th>刪除</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

let data = JSON.parse(localStorage.getItem("checkinData")) || [];
let lastAddDate = localStorage.getItem("lastAddDate") || "";

function save() {
  localStorage.setItem("checkinData", JSON.stringify(data));
}

function render() {
  const tbody = document.querySelector("tbody");
  tbody.innerHTML = "";

  data.forEach((member, index) => {
    const tr = document.createElement("tr");
    tr.draggable = true;

    tr.innerHTML = `
      <td><input value="${member.number}" onchange="update(${index}, 'number', this.value)"></td>
      <td><input value="${member.name}" onchange="update(${index}, 'name', this.value)"></td>
      <td><input type="number" value="${member.days}" onchange="update(${index}, 'days', this.value)"></td>
      <td><input value="${member.note}" onchange="update(${index}, 'note', this.value)"></td>
      <td><button onclick="removeMember(${index})">X</button></td>
    `;

    addDragEvents(tr, index);
    tbody.appendChild(tr);
  });

  updateButtonState();
  save();
}

function addMember() {
  const name = document.getElementById("newName").value.trim();
  if (!name) return;

  data.push({
    number: data.length + 1,
    name: name,
    days: 1,
    note: ""
  });

  document.getElementById("newName").value = "";
  render();
}

function removeMember(index) {
  data.splice(index, 1);
  reNumber();
  render();
}

function update(index, field, value) {
  if (field === "days" || field === "number") value = Number(value);
  data[index][field] = value;
  save();
}

function reNumber() {
  data.forEach((m, i) => m.number = i + 1);
}

function addOneDay() {
  const today = new Date().toDateString();
  if (lastAddDate === today) return;

  data.forEach(m => m.days++);
  lastAddDate = today;
  localStorage.setItem("lastAddDate", today);
  render();
}

function updateButtonState() {
  const today = new Date().toDateString();
  const btn = document.getElementById("addOneBtn");

  if (lastAddDate === today) {
    btn.disabled = true;
  } else {
    btn.disabled = false;
  }
}

function copyAll() {
  let text = "編號 名字 天數 備註\n";
  data.forEach(m => {
    text += `${m.number} ${m.name} ${m.days} ${m.note}\n`;
  });

  navigator.clipboard.writeText(text);
  alert("已複製全部資料！");
}

/* 拖曳功能 */
let dragIndex = null;

function addDragEvents(row, index) {
  row.addEventListener("dragstart", () => {
    dragIndex = index;
    row.classList.add("dragging");
  });

  row.addEventListener("dragend", () => {
    row.classList.remove("dragging");
    reNumber();
    render();
  });

  row.addEventListener("dragover", e => {
    e.preventDefault();
  });

  row.addEventListener("drop", () => {
    const moved = data.splice(dragIndex, 1)[0];
    data.splice(index, 0, moved);
  });
}

render();

</script>

</body>
</html>
